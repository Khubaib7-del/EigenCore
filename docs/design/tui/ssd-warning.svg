<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="148" viewBox="0 0 1008 148" role="img" aria-label="state · model larger than free RAM"><title>state · model larger than free RAM</title><rect width="1008" height="148" rx="10" fill="#14171B"/><rect width="1008" height="28" rx="10" fill="#1F2226"/><rect y="18" width="1008" height="10" fill="#1F2226"/><circle cx="18" cy="14" r="5" fill="#3A3F45"/><circle cx="36" cy="14" r="5" fill="#3A3F45"/><circle cx="54" cy="14" r="5" fill="#3A3F45"/><text x="504.0" y="18" fill="#9AA1AB" font-size="12" text-anchor="middle" font-family="Inter, system-ui, sans-serif">state · model larger than free RAM</text><g font-family="JetBrains Mono, Cascadia Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15"><text y="58" xml:space="preserve"><tspan x="24.0" fill="#E0A84A" font-weight="bold" textLength="38.4" lengthAdjust="spacingAndGlyphs">[!] </tspan><tspan x="62.4" fill="#E0A84A" font-weight="normal" textLength="345.6" lengthAdjust="spacingAndGlyphs">model ‹size› GB &gt; free RAM ‹free› GB</tspan></text><text y="78" xml:space="preserve"><tspan x="24.0" fill="#E8E6E1" font-weight="normal" textLength="758.4" lengthAdjust="spacingAndGlyphs">    llama.cpp will memory-map it and read the rest from the SSD on every token.</tspan></text><text y="98" xml:space="preserve"><tspan x="24.0" fill="#9AA1AB" font-weight="normal" textLength="988.8" lengthAdjust="spacingAndGlyphs">    Decode will be much slower than the bandwidth ceiling. A smaller quant or an MoE model fits better.</tspan></text><text y="118" xml:space="preserve"><tspan x="24.0" fill="#E8E6E1" font-weight="normal">    </tspan><tspan x="62.4" fill="#E8E6E1" font-weight="bold" textLength="28.8" lengthAdjust="spacingAndGlyphs">[c]</tspan><tspan x="91.2" fill="#9AA1AB" font-weight="normal" textLength="115.2" lengthAdjust="spacingAndGlyphs"> continue   </tspan><tspan x="206.4" fill="#E8E6E1" font-weight="bold" textLength="28.8" lengthAdjust="spacingAndGlyphs">[q]</tspan><tspan x="235.2" fill="#9AA1AB" font-weight="normal" textLength="211.2" lengthAdjust="spacingAndGlyphs"> pick another quant   </tspan><tspan x="446.4" fill="#E8E6E1" font-weight="bold" textLength="28.8" lengthAdjust="spacingAndGlyphs">[x]</tspan><tspan x="475.2" fill="#9AA1AB" font-weight="normal" textLength="67.2" lengthAdjust="spacingAndGlyphs"> cancel</tspan></text></g></svg>
