name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # PyPI trusted publishing (OIDC) — no API token stored in GitHub

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Requires the GitHub OIDC publisher configured once at
          # https://pypi.org/manage/project/eigencore/publishing/ (owner action).
          print-hash: true
          # idempotent re-tags: skip files PyPI already has for this version
          skip-existing: true

  windows-app:
    # Builds the web UI, the Windows installer + portable exe (PyInstaller,
    # packaging/windows/EigenCore.spec) and publishes the GitHub Release from
    # this one job. No actions/upload-artifact: files go straight to the
    # release (Actions artifact storage is not used).
    name: Build Windows app and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web UI (ui/dist)
        shell: bash
        working-directory: ui
        run: |
          npm ci
          npm run build
          ls -la dist

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # desktop extra: pywebview (+ pythonnet on Windows) and Flet (fallback)
          python -m pip install -e ".[desktop]"
          # flet-cli + flet-desktop: PyInstaller hooks that bundle the Flet client
          python -m pip install "flet-cli>=1.0,<2" "flet-desktop>=1.0,<2" pyinstaller
          # prebuilt CPU wheel for the bundled inference backend
          python -m pip install "llama-cpp-python>=0.3.0" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Build app folder (for the installer)
        shell: bash
        run: |
          VER=$(python -c "import eigencore; print(eigencore.__version__)")
          echo "VER=$VER" >> "$GITHUB_ENV"
          pyinstaller packaging/windows/EigenCore.spec --noconfirm --clean \
            --distpath dist --workpath build/onedir
          ls -la dist/EigenCore
          test -f dist/EigenCore/_internal/ui/index.html

      - name: Build installer (EigenCore-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VER" "/DSourceDir=$PWD\dist\EigenCore" packaging\windows\EigenCore.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\EigenCore-Setup.exe

      - name: Build portable exe (EigenCore.exe, no install)
        shell: bash
        env:
          EIGENCORE_ONEFILE: "1"
        run: |
          pyinstaller packaging/windows/EigenCore.spec --noconfirm --clean \
            --distpath dist-portable --workpath build/onefile
          ls -la dist-portable/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            CHANGES=$(git log --pretty=format:"- %s" -20 HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            dist/EigenCore-Setup.exe
            dist-portable/EigenCore.exe
          body: |
            ## Download

            - **Windows (recommended):** [EigenCore-Setup.exe](https://github.com/Khubaib7-del/EigenCore/releases/latest/download/EigenCore-Setup.exe). Installs like any other app, shows up in Start and in Settings > Apps, and updates itself from the sidebar.
            - Windows portable (no install): [EigenCore.exe](https://github.com/Khubaib7-del/EigenCore/releases/latest/download/EigenCore.exe)
            - Python / terminal: `pip install eigencore` (see the README)

            ## What's changed
            ${{ steps.changelog.outputs.changes }}
