name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # PyPI trusted publishing (OIDC) — no API token stored in GitHub

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Requires the GitHub OIDC publisher configured once at
          # https://pypi.org/manage/project/eigencore/publishing/ (owner action).
          print-hash: true
          # idempotent re-tags: skip files PyPI already has for this version
          skip-existing: true

  windows-exe:
    name: Build Windows desktop app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "flet>=1.0,<2" pyinstaller
          # prebuilt CPU wheel for the bundled inference backend
          python -m pip install "llama-cpp-python>=0.3.0" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Pack EigenCore.exe with flet
        shell: bash
        run: |
          VER=$(python -c "import eigencore; print(eigencore.__version__)")
          flet pack src/eigencore/desktop/app.py \
            --name EigenCore \
            --icon src/eigencore/desktop/assets/eigencore.ico \
            --product-version "$VER" --file-version "$VER.0" \
            --add-data "src/eigencore/desktop/assets;assets" \
            --pyinstaller-build-args=--collect-all=llama_cpp \
            --distpath dist
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: eigencore-windows-exe
          path: dist/EigenCore.exe

  release:
    runs-on: ubuntu-latest
    needs: [pypi, windows-exe]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: eigencore-windows-exe
          path: dist-exe

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: dist-exe/EigenCore.exe
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changes }}
            
            ## Download
            - **Windows app (one click):** [EigenCore.exe](https://github.com/Khubaib7-del/EigenCore/releases/latest/download/EigenCore.exe) — direct download of the latest build
            - PyPI: `pip install eigencore` — see README
